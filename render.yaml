services:
  - type: web
    name: salestracker-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:80
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: salestracker-db
          property: connectionString
    healthCheckPath: /

databases:
  - name: salestracker-db
    databaseName: salestracker
    user: salestracker
